[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "proof"
version = "0.0.0+cp01"
description = "CP-01 domain schemas and canonical serialization for the Proof engine."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Proof Authors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pydantic==2.12.0",
  "rfc8785==0.1.4",
  "rich==13.9.4",
  "typer==0.20.0",
]

[project.scripts]
proof = "proof.cli:main"

[dependency-groups]
dev = [
  "coverage[toml]==7.6.10",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "ruff==0.8.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proof"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/schemas",
  "/scripts",
  "/src/proof",
  "/tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["proof"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests/unit"]

[tool.coverage.run]
branch = true
source = ["proof"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "artifacts/coverage.xml"
